[package]
name = "echo-app"
version = "0.1.0"
edition = "2021"
description = "ECHO Messenger — post-quantum encrypted desktop messenger"
license = "AGPL-3.0"

[lib]
name = "echo_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
echo-crypto = { path = "../../shared" }
echo-client = { path = "../../echo-client" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
base64 = "0.21"
zeroize = { workspace = true }

[features]
dev-multi = []  # Allow ECHO_VAULT_PATH override for testing two instances. NEVER ship.
