[workspace]
resolver = "2"
members = [
    "shared",
    "server",
    "cli",
    "testbench",
    "echo-client",
    "echo-app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/ghost-protocol/echo-messenger"

[workspace.dependencies]
# Crypto
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
fips203 = "0.4"  # FIPS 203 ML-KEM (final standard, replaces round-3 pqcrypto-kyber)
fips204 = "0.4"  # FIPS 204 ML-DSA (post-quantum signatures, hybrid with Ed25519)

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Async
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
